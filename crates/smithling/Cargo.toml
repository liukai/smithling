[package]
name = "smithling"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "smithling"
path = "src/main.rs"

[features]
default = ["tools"]
# `seed`, `query`, `demo` and `bench`; without it the binary only has `serve`.
tools = ["dep:smithling-tools"]

[dependencies]
smithling-model.workspace = true
smithling-ingest.workspace = true
smithling-storage.workspace = true
smithling-server.workspace = true
smithling-tools = { workspace = true, optional = true }
tokio.workspace = true
clap.workspace = true
tracing-subscriber.workspace = true
tikv-jemallocator.workspace = true
tikv-jemalloc-ctl.workspace = true

[dev-dependencies]
smithling-server = { workspace = true, features = ["testkit"] }
smithling-tools.workspace = true
sqlx.workspace = true
url.workspace = true
uuid.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tempfile.workspace = true
tokio.workspace = true

[[test]]
name = "bench_cli"
required-features = ["tools"]

[[test]]
name = "bench_m2"
required-features = ["tools"]

[[test]]
name = "cli_query"
required-features = ["tools"]

[[test]]
name = "demo"
required-features = ["tools"]

[[test]]
name = "idle_memory"
required-features = ["tools"]
