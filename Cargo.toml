[workspace]
resolver = "3"
members = ["crates/model", "crates/ingest", "crates/query", "crates/tracedb"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
tracedb-model = { path = "crates/model" }
tracedb-ingest = { path = "crates/ingest" }
tracedb-query = { path = "crates/query" }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
crc32fast = "1"
clap = { version = "4", features = ["derive"] }
rust-embed = "8"
tower-http = { version = "0.6", features = ["limit", "compression-gzip"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
proptest = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indexmap = "2"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
