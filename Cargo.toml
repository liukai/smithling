[workspace]
resolver = "3"
members = ["crates/model", "crates/storage", "crates/ingest", "crates/query", "crates/tracedb"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
tracedb-model = { path = "crates/model" }
tracedb-storage = { path = "crates/storage" }
tracedb-ingest = { path = "crates/ingest" }
tracedb-query = { path = "crates/query" }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
crc32fast = "1"
clap = { version = "4", features = ["derive", "env"] }
rust-embed = { version = "8", features = ["mime-guess", "interpolate-folder-path"] }
mime_guess = "2"
tower-http = { version = "0.6", features = ["limit", "compression-gzip"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
proptest = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indexmap = "2"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
tempfile = "3"
base64 = "0.22"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
async-trait = "0.1"
datafusion = { version = "55.2", default-features = false, features = ["parquet", "nested_expressions", "datetime_expressions"] }
object_store = { version = "0.13", features = ["aws"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres", "migrate"] }
ulid = "1"
bytes = "1"
url = "2"
unicode-segmentation = "1.13"
zstd = "0.13"
httparse = "1.10"
moka = { version = "0.12", features = ["sync"] }
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
