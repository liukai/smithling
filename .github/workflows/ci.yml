name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 3 * * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The UI is built and tested on its own; Rust jobs embed its output (M2-FR-25).
  ui:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: ui
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

  # The server builds and tests without Node; the UI is a placeholder page here.
  rust-no-node:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: "! command -v node"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace

  test:
    needs: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: crash, restart and throughput tests (slow)
        run: cargo test --release -p tracedb --test crash --test restart --test throughput -- --ignored
      - name: demo checks (local storage)
        run: cargo run --release -p tracedb -- demo --seed 7
      - name: no outbound connections
        run: sudo apt-get install -y strace && cargo build --release -p tracedb && scripts/no-outbound.sh target/release/tracedb
      - name: runs in a clean container (no Node, Rust or database)
        run: |
          docker run -d --name tdb --network host -v "$PWD/target/release/tracedb:/usr/local/bin/tracedb:ro" ubuntu:24.04 tracedb serve --data /tmp/d --port 7171
          for i in $(seq 50); do curl -sf localhost:7171/healthz && break; sleep 0.2; done
          curl -sf localhost:7171/healthz
          curl -sf localhost:7171/ | grep -q '<div id="root">'
          docker rm -f tdb

  # Same checks on S3 (MinIO) and Postgres in local containers (M2 SC-08, M3 SC-07). Credentials are random per run
  # and masked.
  cloud:
    needs: ui
    runs-on: ubuntu-latest
    env:
      AWS_ENDPOINT: http://127.0.0.1:9000
      AWS_REGION: us-east-1
      TRACEDB_TEST_S3_URL: s3://tracedb/test
      TRACEDB_TEST_PG_URL: postgres://tracedb@127.0.0.1:5432/tracedb
      TRACEDB_TEST_REQUIRE_CLOUD: "1"
    steps:
      - uses: actions/checkout@v4
      # Names the path of any duplicate key (a second `run:` slipped into a step once) before the slow steps.
      - name: no duplicate keys in workflow and compose YAML
        run: |
          ruby -rpsych -e '
            def walk(n, at)
              if n.is_a?(Psych::Nodes::Mapping)
                keys = n.children.each_slice(2).map { |k, _| k.respond_to?(:value) ? k.value : k.to_s }
                dups = keys.select { |k| keys.count(k) > 1 }.uniq
                abort "#{at}: duplicate keys #{dups.join(", ")}" unless dups.empty?
                n.children.each_slice(2) { |k, v| walk(v, "#{at}.#{k.respond_to?(:value) ? k.value : k}") }
              else
                Array(n.children).each_with_index { |c, i| walk(c, "#{at}[#{i}]") }
              end
            end
            (Dir[".github/workflows/*.yml"] + Dir["ci/*.yml"]).each { |f| walk(Psych.parse_stream(File.read(f)), f) }
          '
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - name: throwaway credentials
        run: |
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY PGPASSWORD; do
            s=$(openssl rand -hex 20)
            echo "::add-mask::$s"
            echo "$v=$s" >> "$GITHUB_ENV"
          done
      - name: start MinIO and Postgres
        run: |
          docker compose -f ci/cloud.yml up -d --wait minio postgres
          docker compose -f ci/cloud.yml run --rm bucket
      - name: storage trait tests (S3, Postgres; incl. sidecar range reads, catalog v2, feedback table)
        shell: bash
        run: cargo test -p tracedb-storage --test traits
      - name: demo checks, M2 + M3 (local storage, then S3 + Postgres)
        shell: bash
        run: |
          cargo run --release -p tracedb -- demo --seed 7 | tee demo-local.txt
          cargo run --release -p tracedb -- demo --seed 7 --storage s3://tracedb/ci --metastore "$TRACEDB_TEST_PG_URL" | tee demo-cloud.txt
      - name: same demo table as local storage
        shell: bash
        run: |
          table() { grep -v '^tracedb demo' "$1" | sed -E 's/ +[0-9]+ ms$//'; }
          diff <(table demo-local.txt) <(table demo-cloud.txt)
      - name: sidecars in the bucket, feedback in Postgres
        shell: bash
        run: |
          docker compose -f ci/cloud.yml run --rm -T --entrypoint /bin/sh bucket -c \
            'mc alias set local http://minio:9000 "$MC_ACCESS_KEY" "$MC_SECRET_KEY" >/dev/null && mc ls -r local/tracedb/ci/' \
            | grep 'fts\.post$' >/dev/null || { echo "no text index sidecars under s3://tracedb/ci"; exit 1; }
          n=$(docker compose -f ci/cloud.yml exec -T postgres psql -U tracedb -d tracedb -tAc 'SELECT count(*) FROM feedback')
          test "$n" = 2 || { echo "feedback rows in Postgres: $n, expected 2"; exit 1; }
      - name: crash harness (S3 + Postgres; incl. after_fts_put)
        run: cargo test --release -p tracedb --test crash -- --ignored --nocapture
      - name: container logs
        if: failure()
        run: docker compose -f ci/cloud.yml logs --no-color minio postgres

  # The speed table (M3-FR-17, SC-10): budgets are the SC-03 targets scaled by a calibration run on the runner.
  # A slipped row fails the job, naming the query, target and value; the table goes in the job summary.
  bench-smoke:
    if: github.event_name == 'pull_request'
    env:
      RUST_LOG: warn
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p tracedb
      - name: bench, 200k runs
        shell: bash
        run: ./target/release/tracedb bench --smoke --check --json bench.json 2>&1 | tee bench.txt
      - name: table in the job summary
        if: always()
        shell: bash
        run: |
          { echo '### tracedb bench --smoke'; echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-smoke
          path: bench.json

  bench-full:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    # One 2M run at a time; a newer push waits rather than cancelling the one being measured.
    concurrency:
      group: bench-full
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUST_LOG: warn
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p tracedb
      - name: bench, 2M runs
        shell: bash
        run: ./target/release/tracedb bench --runs 2000000 --check --json bench.json 2>&1 | tee bench.txt
      - name: table in the job summary
        if: always()
        shell: bash
        run: |
          { echo '### tracedb bench --runs 2000000'; echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-full
          path: bench.json
